[project]
name = "vidgen"
version = "0.1.0"
description = "Topic to faceless video pipeline (stock + local AI visuals, TTS, FFmpeg)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "httpx>=0.27",
    "edge-tts>=7.0",
    "faster-whisper>=1.1",
    "google-genai>=1.0",
    "python-slugify>=8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
vidgen = "vidgen.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that render video"]
