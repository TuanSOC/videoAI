output_dir: output
cache_dir: cache

formats:
  short:
    width: 1080
    height: 1920
    fps: 30
    target_seconds: [45, 75]
    max_ai_video: 1   # tuned for 8GB VRAM (RTX 4060 Laptop)
  long:
    width: 1920
    height: 1080
    fps: 30
    target_seconds: [480, 900]
    max_ai_video: 2

voices:
  vi: vi-VN-HoaiMyNeural
  en: en-US-AndrewMultilingualNeural

llm:
  # tried in order; "gemini" may bill once its free quota is exceeded, so it's off by default
  providers: [ollama]
  ollama_model: qwen3:8b
  ollama_think: false   # qwen3 "thinking" is slow and not needed for JSON scripts
  gemini_model: gemini-2.5-flash

# fetch Wikipedia passages about the topic and restrict the script's facts to them
research: true

ai:
  # sizes/frames tuned for 8GB VRAM; raise on a bigger GPU
  image_size: {short: [768, 1344], long: [1344, 768]}
  video_size: {short: [544, 960], long: [960, 544]}
  video_frames: 81     # Wan 2.2 at 24fps ≈ 3.4s; longer scenes loop the clip
  timeout_seconds: 1800

whisper:
  model: small
  device: cuda
  compute_type: float16
