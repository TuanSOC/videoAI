output_dir: output
cache_dir: cache

formats:
  short:
    width: 1080
    height: 1920
    fps: 30
    target_seconds: [45, 75]
    max_ai_video: 1   # tuned for 8GB VRAM (RTX 4060 Laptop)
  long:
    width: 1920
    height: 1080
    fps: 30
    target_seconds: [480, 900]
    max_ai_video: 2

voices:
  vi: vi-VN-HoaiMyNeural
  en: en-US-AndrewMultilingualNeural
voice_rate: "+8%"   # edge-tts speaking rate ("+0%" = default pace)

llm:
  # tried in order; "gemini" may bill once its free quota is exceeded, so it's off by default
  providers: [ollama]
  ollama_model: qwen3:8b
  ollama_think: false   # qwen3 "thinking" is slow and not needed for JSON scripts
  gemini_model: gemini-2.5-flash

# look at stock thumbnails with a local vision model before choosing a clip (ollama pull qwen2.5vl:7b)
vision:
  enabled: true
  model: qwen2.5vl:7b

# automatic sound effects (whoosh at dissolves, impact on the hook/shock words, pop on numbers);
# sounds are synthesised into assets/sfx/ — drop your own files there to replace them
sfx:
  enabled: true
  density: subtle   # minimal | subtle | dense

# scenes quoting a figure become a card with the real source sentence and a highlighter sweep
documents:
  enabled: true

# fetch Wikipedia passages about the topic and restrict the script's facts to them
research: true

ai:
  # sizes/frames tuned for 8GB VRAM; raise on a bigger GPU
  image_size: {short: [768, 1344], long: [1344, 768]}
  video_size: {short: [544, 960], long: [960, 544]}
  video_frames: 81     # Wan 2.2 at 24fps ≈ 3.4s; longer scenes loop the clip
  timeout_seconds: 1800

whisper:
  model: small
  device: cuda
  compute_type: float16
